<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Famba Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --primary: #8BD17C;
            --primary-dark: #5BA34D;
            --primary-light: #e8f5e3;
            --bg: #f8faf7;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --purple: #a855f7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* Sidebar */
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; z-index: 100; overflow-y: auto; }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .logo-icon { width: 44px; height: 44px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
        .logo-text { font-size: 24px; font-weight: 700; color: var(--text); }
        .logo-text span { color: var(--text-secondary); font-size: 12px; font-weight: 500; display: block; }
        .nav-section { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); padding: 16px 16px 8px; letter-spacing: 0.5px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-radius: 10px; color: var(--text-secondary); text-decoration: none; margin-bottom: 2px; transition: all 0.2s; cursor: pointer; font-size: 14px; font-weight: 500; }
        .nav-item:hover { background: var(--primary-light); color: var(--primary-dark); }
        .nav-item.active { background: var(--primary); color: white; }
        .nav-item i { font-size: 20px; width: 24px; text-align: center; }
        .nav-item .badge { margin-left: auto; background: var(--error); color: white; font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
        .nav-item.active .badge { background: rgba(255,255,255,0.3); }

        /* Main content */
        .main { margin-left: 260px; padding: 24px 32px; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header h1 { font-size: 26px; font-weight: 700; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn { padding: 9px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary-dark); }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
        .btn-danger { background: var(--error); color: white; }

        /* Stats grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--surface); border-radius: 14px; padding: 20px; border: 1px solid var(--border); }
        .stat-card .icon { width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 14px; }
        .stat-card .icon.green { background: #dcfce7; color: var(--success); }
        .stat-card .icon.blue { background: #dbeafe; color: var(--info); }
        .stat-card .icon.orange { background: #fef3c7; color: var(--warning); }
        .stat-card .icon.purple { background: #f3e8ff; color: var(--purple); }
        .stat-card .icon.red { background: #fee2e2; color: var(--error); }
        .stat-card .value { font-size: 28px; font-weight: 700; margin-bottom: 2px; }
        .stat-card .label { color: var(--text-secondary); font-size: 13px; }

        /* Cards & Tables */
        .card { background: var(--surface); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; }
        .card-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-header h2 { font-size: 16px; font-weight: 600; }
        .card-body { padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 18px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--bg); font-weight: 600; font-size: 11px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.3px; }
        td { font-size: 13px; }
        tr:last-child td { border-bottom: none; }
        .status { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .status.searching, .status.placed { background: #fef3c7; color: #b45309; }
        .status.driver_assigned, .status.confirmed { background: #dbeafe; color: #1d4ed8; }
        .status.enroute, .status.preparing, .status.picked_up, .status.delivering { background: #e0e7ff; color: #4338ca; }
        .status.arrived, .status.ready { background: #d1fae5; color: #065f46; }
        .status.riding { background: #dcfce7; color: var(--success); }
        .status.complete, .status.delivered { background: #dcfce7; color: #166534; }
        .status.cancelled { background: #fee2e2; color: var(--error); }
        .status.scheduled { background: #f3e8ff; color: var(--purple); }
        .status.active { background: #dcfce7; color: var(--success); }
        .status.inactive { background: #f3f4f6; color: var(--text-secondary); }
        .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: white; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
        .user-cell { display: flex; align-items: center; gap: 10px; }

        /* Grid layouts */
        .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        .grid-2-equal { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }

        /* Empty state */
        .empty { text-align: center; padding: 48px 20px; color: var(--text-secondary); }
        .empty i { font-size: 48px; margin-bottom: 12px; display: block; opacity: 0.3; }
        .empty p { font-size: 14px; }
        .loading-row td { text-align: center; padding: 32px; color: var(--text-secondary); font-size: 13px; }

        /* Tabs */
        .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--primary-dark); border-bottom-color: var(--primary); }

        /* Restaurant card */
        .rest-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; transition: all 0.2s; }
        .rest-card:hover { border-color: var(--primary); }
        .rest-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .rest-card .meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
        .rest-card .rest-stats { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); }
        .rest-card .rest-stats span { display: flex; align-items: center; gap: 4px; }
        .rest-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--primary-light); color: var(--primary-dark); }

        /* Settings form */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: var(--text); }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        /* Responsive */
        @media (max-width: 1200px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .grid-2, .grid-2-equal { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; padding: 16px; } .stats-grid { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="ri-motorbike-fill"></i></div>
            <div class="logo-text">Famba<span>Admin Panel</span></div>
        </div>
        <nav>
            <div class="nav-section">Overview</div>
            <a class="nav-item active" data-page="dashboard"><i class="ri-dashboard-line"></i> Dashboard</a>

            <div class="nav-section">Ride-Hailing</div>
            <a class="nav-item" data-page="rides"><i class="ri-route-line"></i> Rides</a>
            <a class="nav-item" data-page="drivers"><i class="ri-user-star-line"></i> Drivers</a>

            <div class="nav-section">Food Delivery</div>
            <a class="nav-item" data-page="restaurants"><i class="ri-store-2-line"></i> Restaurants</a>
            <a class="nav-item" data-page="food-orders"><i class="ri-shopping-bag-line"></i> Food Orders</a>

            <div class="nav-section">Users & Revenue</div>
            <a class="nav-item" data-page="riders"><i class="ri-user-line"></i> Users</a>
            <a class="nav-item" data-page="earnings"><i class="ri-money-dollar-circle-line"></i> Earnings</a>
            <a class="nav-item" data-page="promos"><i class="ri-coupon-line"></i> Promo Codes</a>

            <div class="nav-section">System</div>
            <a class="nav-item" data-page="support"><i class="ri-customer-service-line"></i> Support</a>
            <a class="nav-item" data-page="settings"><i class="ri-settings-line"></i> Settings</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main" id="main-content"></main>

    <script>
    // ==================== API ====================
    const API = 'http://localhost:8000';
    const AUTH = 'Basic ' + btoa('demo:demo123');

    async function apiFetch(endpoint, opts = {}) {
        try {
            const res = await fetch(`${API}${endpoint}`, {
                headers: { 'Authorization': AUTH, 'Content-Type': 'application/json', ...opts.headers },
                ...opts,
            });
            return await res.json();
        } catch (e) { console.error('API Error:', e); return null; }
    }
    async function apiPost(endpoint, body) {
        return apiFetch(endpoint, { method: 'POST', body: JSON.stringify(body) });
    }

    // ==================== STATE ====================
    let cachedStats = null;
    const $ = id => document.getElementById(id);
    const main = () => $('main-content');

    // ==================== ROUTER ====================
    function navigate(page) {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        const active = document.querySelector(`.nav-item[data-page="${page}"]`);
        if (active) active.classList.add('active');
        const pages = { dashboard: pageDashboard, rides: pageRides, drivers: pageDrivers, riders: pageRiders, earnings: pageEarnings, promos: pagePromos, restaurants: pageRestaurants, 'food-orders': pageFoodOrders, support: pageSupport, settings: pageSettings };
        (pages[page] || pageDashboard)();
    }

    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => navigate(item.dataset.page));
    });

    // ==================== HELPERS ====================
    function statusBadge(s) { return `<span class="status ${s}">${s.replace('_', ' ')}</span>`; }
    function avatarCell(name, sub) {
        const initial = (name || '?')[0].toUpperCase();
        return `<div class="user-cell"><div class="avatar">${initial}</div><div><div style="font-weight:500">${name || '-'}</div>${sub ? `<small style="color:var(--text-secondary)">${sub}</small>` : ''}</div></div>`;
    }
    function money(v) { return `$${(v || 0).toFixed(2)}`; }
    function timeAgo(iso) {
        if (!iso) return '-';
        const d = new Date(iso), now = new Date(), diff = (now - d) / 1000;
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        return d.toLocaleDateString();
    }

    // ==================== DASHBOARD ====================
    async function pageDashboard() {
        main().innerHTML = `
            <div class="header"><h1>Dashboard</h1><div class="header-actions"><button class="btn btn-primary" onclick="pageDashboard()"><i class="ri-refresh-line"></i> Refresh</button></div></div>
            <div class="stats-grid" id="dash-stats"><div class="stat-card"><div class="loading-row"><td>Loading...</td></div></div></div>
            <div class="grid-2"><div class="card"><div class="card-header"><h2>Recent Rides</h2><button class="btn btn-outline btn-sm" onclick="navigate('rides')">View All</button></div><table><thead><tr><th>ID</th><th>Rider</th><th>Driver</th><th>Route</th><th>Fare</th><th>Status</th></tr></thead><tbody id="dash-rides"><tr><td colspan="6" class="loading-row">Loading...</td></tr></tbody></table></div>
            <div class="card"><div class="card-header"><h2>Recent Food Orders</h2><button class="btn btn-outline btn-sm" onclick="navigate('food-orders')">View All</button></div><table><thead><tr><th>Order</th><th>Restaurant</th><th>Total</th><th>Status</th></tr></thead><tbody id="dash-food"><tr><td colspan="4" class="loading-row">Loading...</td></tr></tbody></table></div></div>`;

        const stats = await apiFetch('/admin/stats');
        if (!stats) return;
        cachedStats = stats;

        $('dash-stats').innerHTML = `
            <div class="stat-card"><div class="icon green"><i class="ri-money-dollar-circle-line"></i></div><div class="value">${money(stats.total_revenue)}</div><div class="label">Total Revenue</div></div>
            <div class="stat-card"><div class="icon blue"><i class="ri-route-line"></i></div><div class="value">${stats.total_rides}</div><div class="label">Rides</div></div>
            <div class="stat-card"><div class="icon orange"><i class="ri-shopping-bag-line"></i></div><div class="value">${stats.total_food_orders}</div><div class="label">Food Orders</div></div>
            <div class="stat-card"><div class="icon purple"><i class="ri-user-star-line"></i></div><div class="value">${stats.total_drivers}</div><div class="label">Drivers</div></div>`;

        const rides = stats.recent_rides || [];
        $('dash-rides').innerHTML = rides.length === 0 ? '<tr><td colspan="6" class="loading-row">No rides yet</td></tr>' :
            rides.slice(0, 5).map(j => `<tr><td><strong>${j.id}</strong></td><td>${avatarCell(j.rider_name)}</td><td>${j.driver?.name || '-'}</td><td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${j.pickup_text || ''} → ${j.drop_text || ''}</td><td>${money(j.fare_usd)}</td><td>${statusBadge(j.status)}</td></tr>`).join('');

        const orders = stats.recent_food_orders || [];
        $('dash-food').innerHTML = orders.length === 0 ? '<tr><td colspan="4" class="loading-row">No orders yet</td></tr>' :
            orders.slice(0, 5).map(o => `<tr><td><strong>${o.id}</strong></td><td>${o.restaurant_id}</td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td></tr>`).join('');
    }

    // ==================== RIDES ====================
    async function pageRides() {
        main().innerHTML = `
            <div class="header"><h1>Rides</h1><div class="header-actions"><button class="btn btn-primary" onclick="pageRides()"><i class="ri-refresh-line"></i> Refresh</button></div></div>
            <div class="card"><table><thead><tr><th>ID</th><th>Rider</th><th>Driver</th><th>Pickup</th><th>Dropoff</th><th>Distance</th><th>Fare</th><th>Payment</th><th>Status</th><th>Created</th></tr></thead><tbody id="rides-body"><tr><td colspan="10" class="loading-row">Loading...</td></tr></tbody></table></div>`;
        const jobs = await apiFetch('/jobs');
        if (!jobs || !Array.isArray(jobs) || jobs.length === 0) {
            $('rides-body').innerHTML = '<tr><td colspan="10" class="loading-row">No rides found</td></tr>'; return;
        }
        $('rides-body').innerHTML = jobs.map(j => `<tr>
            <td><strong>${j.id}</strong></td>
            <td>${avatarCell(j.rider_name)}</td>
            <td>${j.driver?.name || '-'}</td>
            <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${j.pickup_text || '-'}</td>
            <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${j.drop_text || '-'}</td>
            <td>${j.distance_km ? j.distance_km.toFixed(1) + ' km' : '-'}</td>
            <td><strong>${money(j.fare_usd)}</strong></td>
            <td>${j.payment_method || 'cash'}</td>
            <td>${statusBadge(j.status)}</td>
            <td>${timeAgo(j.created_at)}</td>
        </tr>`).join('');
    }

    // ==================== DRIVERS ====================
    async function pageDrivers() {
        main().innerHTML = `
            <div class="header"><h1>Drivers</h1><div class="header-actions"><button class="btn btn-primary" onclick="pageDrivers()"><i class="ri-refresh-line"></i> Refresh</button></div></div>
            <div class="stats-grid" id="driver-stats"></div>
            <div class="card"><table><thead><tr><th>Driver</th><th>Vehicle</th><th>Plate</th><th>Rating</th><th>Trips</th><th>Earnings</th><th>Verified</th><th>Status</th></tr></thead><tbody id="drivers-body"><tr><td colspan="8" class="loading-row">Loading...</td></tr></tbody></table></div>`;

        const [driversRes, leaderboard] = await Promise.all([apiFetch('/drivers'), apiFetch('/drivers/earnings/leaderboard')]);
        const drivers = driversRes?.drivers || [];
        const earnings = leaderboard?.drivers || [];
        const earningsMap = {};
        earnings.forEach(e => earningsMap[e.id] = e);

        const online = drivers.filter(d => d.is_online).length;
        $('driver-stats').innerHTML = `
            <div class="stat-card"><div class="icon green"><i class="ri-user-star-line"></i></div><div class="value">${drivers.length}</div><div class="label">Total Drivers</div></div>
            <div class="stat-card"><div class="icon blue"><i class="ri-wifi-line"></i></div><div class="value">${online}</div><div class="label">Online Now</div></div>
            <div class="stat-card"><div class="icon orange"><i class="ri-star-line"></i></div><div class="value">${drivers.length ? (drivers.reduce((s,d)=>s+d.rating,0)/drivers.length).toFixed(1) : '0'}</div><div class="label">Avg Rating</div></div>
            <div class="stat-card"><div class="icon purple"><i class="ri-money-dollar-circle-line"></i></div><div class="value">${money(earnings.reduce((s,e)=>s+(e.net_earnings||0),0))}</div><div class="label">Total Earnings</div></div>`;

        $('drivers-body').innerHTML = drivers.length === 0 ? '<tr><td colspan="8" class="loading-row">No drivers</td></tr>' :
            drivers.map(d => {
                const e = earningsMap[d.id] || {};
                return `<tr>
                    <td>${avatarCell(d.name, d.phone || '')}</td>
                    <td>${d.vehicle_make || ''} ${d.vehicle_model || ''} <span style="color:var(--text-secondary)">${d.vehicle_color || ''}</span></td>
                    <td><strong>${d.license_plate || '-'}</strong></td>
                    <td>⭐ ${d.rating}</td>
                    <td>${e.total_trips || 0}</td>
                    <td>${money(e.net_earnings)}</td>
                    <td>${d.is_verified ? '<span class="status active">Verified</span>' : '<span class="status inactive">Pending</span>'}</td>
                    <td>${d.is_online ? '<span class="status active">Online</span>' : '<span class="status inactive">Offline</span>'}</td>
                </tr>`;
            }).join('');
    }

    // ==================== USERS (RIDERS) ====================
    async function pageRiders() {
        main().innerHTML = `
            <div class="header"><h1>Users</h1><div class="header-actions"><button class="btn btn-primary" onclick="pageRiders()"><i class="ri-refresh-line"></i> Refresh</button></div></div>
            <div class="card"><table><thead><tr><th>User</th><th>Phone</th><th>Type</th><th>Wallet</th><th>Verified</th><th>Joined</th></tr></thead><tbody id="users-body"><tr><td colspan="6" class="loading-row">Loading...</td></tr></tbody></table></div>`;
        const data = await apiFetch('/admin/users');
        const users = data?.users || [];
        $('users-body').innerHTML = users.length === 0 ? '<tr><td colspan="6" class="loading-row">No users registered yet</td></tr>' :
            users.map(u => `<tr>
                <td>${avatarCell(u.name, u.email || '')}</td>
                <td>${u.phone}</td>
                <td><span class="rest-badge">${u.user_type}</span></td>
                <td>${money(u.wallet_balance)}</td>
                <td>${u.is_verified ? '<span class="status active">Yes</span>' : '<span class="status inactive">No</span>'}</td>
                <td>${timeAgo(u.created_at)}</td>
            </tr>`).join('');
    }

    // ==================== EARNINGS ====================
    async function pageEarnings() {
        main().innerHTML = `
            <div class="header"><h1>Earnings</h1><div class="header-actions"><button class="btn btn-primary" onclick="pageEarnings()"><i class="ri-refresh-line"></i> Refresh</button></div></div>
            <div class="stats-grid" id="earn-stats"></div>
            <div class="grid-2-equal">
                <div class="card"><div class="card-header"><h2>Revenue Breakdown</h2></div><div class="card-body" id="earn-breakdown"></div></div>
                <div class="card"><div class="card-header"><h2>Driver Leaderboard</h2></div><table><thead><tr><th>Driver</th><th>Trips</th><th>Net Earnings</th></tr></thead><tbody id="earn-leaders"><tr><td colspan="3" class="loading-row">Loading...</td></tr></tbody></table></div>
            </div>`;

        const [stats, leaderboard] = await Promise.all([apiFetch('/admin/stats'), apiFetch('/drivers/earnings/leaderboard')]);
        if (!stats) return;

        $('earn-stats').innerHTML = `
            <div class="stat-card"><div class="icon green"><i class="ri-money-dollar-circle-line"></i></div><div class="value">${money(stats.total_revenue)}</div><div class="label">Total Revenue</div></div>
            <div class="stat-card"><div class="icon blue"><i class="ri-route-line"></i></div><div class="value">${money(stats.ride_revenue)}</div><div class="label">Ride Revenue</div></div>
            <div class="stat-card"><div class="icon orange"><i class="ri-restaurant-line"></i></div><div class="value">${money(stats.food_revenue)}</div><div class="label">Food Revenue</div></div>
            <div class="stat-card"><div class="icon purple"><i class="ri-percent-line"></i></div><div class="value">${stats.total_revenue > 0 ? ((stats.food_revenue / stats.total_revenue) * 100).toFixed(0) : 0}%</div><div class="label">Food Share</div></div>`;

        const rideShare = stats.total_revenue > 0 ? ((stats.ride_revenue / stats.total_revenue) * 100).toFixed(1) : 0;
        const foodShare = stats.total_revenue > 0 ? ((stats.food_revenue / stats.total_revenue) * 100).toFixed(1) : 0;
        $('earn-breakdown').innerHTML = `
            <div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:600"><span>Rides</span><span>${money(stats.ride_revenue)} (${rideShare}%)</span></div><div style="height:10px;background:var(--border);border-radius:5px;overflow:hidden"><div style="height:100%;width:${rideShare}%;background:var(--info);border-radius:5px"></div></div></div>
            <div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:600"><span>Food Delivery</span><span>${money(stats.food_revenue)} (${foodShare}%)</span></div><div style="height:10px;background:var(--border);border-radius:5px;overflow:hidden"><div style="height:100%;width:${foodShare}%;background:var(--warning);border-radius:5px"></div></div></div>
            <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:16px"><div style="display:flex;justify-content:space-between;font-weight:700;font-size:15px"><span>Total</span><span>${money(stats.total_revenue)}</span></div></div>
            <div style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div style="background:var(--bg);padding:14px;border-radius:10px;text-align:center"><div style="font-size:22px;font-weight:700">${stats.total_rides}</div><div style="font-size:12px;color:var(--text-secondary)">Total Rides</div></div>
                <div style="background:var(--bg);padding:14px;border-radius:10px;text-align:center"><div style="font-size:22px;font-weight:700">${stats.total_food_orders}</div><div style="font-size:12px;color:var(--text-secondary)">Food Orders</div></div>
            </div>`;

        const leaders = leaderboard?.drivers || [];
        $('earn-leaders').innerHTML = leaders.length === 0 ? '<tr><td colspan="3" class="loading-row">No earnings data</td></tr>' :
            leaders.map((d, i) => `<tr><td>${avatarCell(d.name, '⭐ ' + d.rating)}</td><td>${d.total_trips}</td><td><strong>${money(d.net_earnings)}</strong></td></tr>`).join('');
    }

    // ==================== PROMO CODES ====================
    async function pagePromos() {
        main().innerHTML = `
            <div class="header"><h1>Promo Codes</h1><div class="header-actions"><button class="btn btn-primary" onclick="pagePromos()"><i class="ri-refresh-line"></i> Refresh</button></div></div>
            <div class="card"><div class="card-header"><h2>Active Promos</h2></div><table><thead><tr><th>Code</th><th>Discount</th><th>Max Discount</th><th>Uses</th><th>Status</th><th>Test</th></tr></thead><tbody id="promos-body"><tr><td colspan="6" class="loading-row">Loading...</td></tr></tbody></table></div>
            <div class="card"><div class="card-header"><h2>Test Promo Code</h2></div><div class="card-body"><div style="display:flex;gap:12px;max-width:400px"><input type="text" id="promo-input" placeholder="Enter code..." style="flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px"><button class="btn btn-primary" onclick="testPromo()">Validate</button></div><div id="promo-result" style="margin-top:12px"></div></div></div>`;

        // We validate known codes to get their info
        const codes = ['FAMBA50', 'RIDE25', 'FIRST10', 'FOOD20'];
        const results = await Promise.all(codes.map(c => apiPost('/promo/validate', { code: c })));
        $('promos-body').innerHTML = results.map((r, i) => `<tr>
            <td><strong style="font-family:monospace;font-size:14px;letter-spacing:1px">${codes[i]}</strong></td>
            <td>${r?.valid ? r.discount + '%' : '-'}</td>
            <td>${r?.valid ? money(r.max_discount) : '-'}</td>
            <td>-</td>
            <td>${r?.valid ? '<span class="status active">Active</span>' : '<span class="status cancelled">Expired</span>'}</td>
            <td><button class="btn btn-outline btn-sm" onclick="document.getElementById('promo-input').value='${codes[i]}';testPromo()">Test</button></td>
        </tr>`).join('');
    }

    async function testPromo() {
        const code = $('promo-input').value.trim();
        if (!code) return;
        const result = await apiPost('/promo/validate', { code });
        $('promo-result').innerHTML = result?.valid
            ? `<div style="padding:12px;background:#dcfce7;border-radius:10px;color:#166534;font-weight:500"><i class="ri-check-line"></i> ${result.message}</div>`
            : `<div style="padding:12px;background:#fee2e2;border-radius:10px;color:var(--error);font-weight:500"><i class="ri-close-line"></i> ${result?.message || 'Invalid code'}</div>`;
    }

    // ==================== RESTAURANTS ====================
    async function pageRestaurants() {
        main().innerHTML = `
            <div class="header"><h1>Restaurants</h1><div class="header-actions"><button class="btn btn-primary" onclick="pageRestaurants()"><i class="ri-refresh-line"></i> Refresh</button></div></div>
            <div class="tabs"><div class="tab active" onclick="filterRest('all',this)">All</div><div class="tab" onclick="filterRest('fast_food',this)">Fast Food</div><div class="tab" onclick="filterRest('restaurant',this)">Restaurants</div><div class="tab" onclick="filterRest('cafe',this)">Cafes</div></div>
            <div class="grid-3" id="rest-grid"><div class="rest-card"><div class="loading-row"><td>Loading...</td></div></div></div>`;
        const data = await apiFetch('/restaurants');
        window._allRestaurants = data?.restaurants || [];
        renderRestaurants(window._allRestaurants);
    }

    function renderRestaurants(list) {
        $('rest-grid').innerHTML = list.length === 0 ? '<div class="empty"><i class="ri-store-2-line"></i><p>No restaurants found</p></div>' :
            list.map(r => `<div class="rest-card">
                <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px">
                    <div><h3>${r.name}</h3><div class="meta">${r.cuisine || r.category}</div></div>
                    <div>${r.is_featured ? '<span class="rest-badge">Featured</span>' : ''}</div>
                </div>
                <div class="meta" style="margin-bottom:10px">${r.address}, ${r.area}</div>
                <div class="rest-stats">
                    <span>⭐ ${r.rating}</span>
                    <span><i class="ri-shopping-bag-line"></i> ${r.total_orders} orders</span>
                    <span><i class="ri-truck-line"></i> ${money(r.delivery_fee)}</span>
                    <span><i class="ri-time-line"></i> ${r.avg_prep_time_min}min</span>
                </div>
                <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
                    <span>${r.is_open ? '<span class="status active">Open</span>' : '<span class="status cancelled">Closed</span>'}</span>
                    <button class="btn btn-outline btn-sm" onclick="viewRestMenu('${r.id}')">View Menu</button>
                </div>
            </div>`).join('');
    }

    function filterRest(cat, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        if (cat === 'all') renderRestaurants(window._allRestaurants);
        else renderRestaurants(window._allRestaurants.filter(r => r.category === cat));
    }

    async function viewRestMenu(id) {
        const data = await apiFetch(`/restaurants/${id}`);
        if (!data) return;
        const menu = data.menu || [];
        const cats = [...new Set(menu.map(i => i.category))];

        main().innerHTML = `
            <div class="header"><h1>${data.name}</h1><div class="header-actions"><button class="btn btn-outline" onclick="pageRestaurants()"><i class="ri-arrow-left-line"></i> Back</button></div></div>
            <div class="stats-grid">
                <div class="stat-card"><div class="icon green"><i class="ri-star-line"></i></div><div class="value">${data.rating}</div><div class="label">Rating</div></div>
                <div class="stat-card"><div class="icon blue"><i class="ri-shopping-bag-line"></i></div><div class="value">${data.total_orders}</div><div class="label">Orders</div></div>
                <div class="stat-card"><div class="icon orange"><i class="ri-truck-line"></i></div><div class="value">${money(data.delivery_fee)}</div><div class="label">Delivery Fee</div></div>
                <div class="stat-card"><div class="icon purple"><i class="ri-time-line"></i></div><div class="value">${data.avg_prep_time_min}m</div><div class="label">Prep Time</div></div>
            </div>
            <div class="card"><div class="card-header"><h2>Menu (${menu.length} items)</h2></div>
            <table><thead><tr><th>Item</th><th>Category</th><th>Price</th><th>Popular</th><th>Available</th></tr></thead><tbody>${
                menu.length === 0 ? '<tr><td colspan="5" class="loading-row">No menu items</td></tr>' :
                menu.map(i => `<tr>
                    <td><div><strong>${i.name}</strong></div><small style="color:var(--text-secondary)">${i.description || ''}</small></td>
                    <td><span class="rest-badge">${i.category}</span></td>
                    <td><strong>${money(i.price)}</strong></td>
                    <td>${i.is_popular ? '🔥' : '-'}</td>
                    <td>${i.is_available ? '<span class="status active">Yes</span>' : '<span class="status cancelled">No</span>'}</td>
                </tr>`).join('')
            }</tbody></table></div>`;
    }

    // ==================== FOOD ORDERS ====================
    async function pageFoodOrders() {
        main().innerHTML = `
            <div class="header"><h1>Food Orders</h1><div class="header-actions"><button class="btn btn-primary" onclick="pageFoodOrders()"><i class="ri-refresh-line"></i> Refresh</button></div></div>
            <div class="card"><table><thead><tr><th>ID</th><th>Customer</th><th>Restaurant</th><th>Items</th><th>Subtotal</th><th>Delivery</th><th>Total</th><th>Payment</th><th>Driver</th><th>Status</th><th>Time</th></tr></thead><tbody id="food-body"><tr><td colspan="11" class="loading-row">Loading...</td></tr></tbody></table></div>`;
        const data = await apiFetch('/food-orders');
        const orders = data?.orders || [];
        $('food-body').innerHTML = orders.length === 0 ? '<tr><td colspan="11" class="loading-row">No food orders yet</td></tr>' :
            orders.map(o => `<tr>
                <td><strong>${o.id}</strong></td>
                <td>${avatarCell(o.rider_name || 'Guest')}</td>
                <td>${o.restaurant_id}</td>
                <td>${(o.items || []).length} items</td>
                <td>${money(o.subtotal)}</td>
                <td>${money(o.delivery_fee)}</td>
                <td><strong>${money(o.total)}</strong></td>
                <td>${o.payment_method}</td>
                <td>${o.driver?.name || '-'}</td>
                <td>${statusBadge(o.status)}</td>
                <td>${timeAgo(o.created_at)}</td>
            </tr>`).join('');
    }

    // ==================== SUPPORT ====================
    function pageSupport() {
        main().innerHTML = `
            <div class="header"><h1>Support</h1></div>
            <div class="grid-2-equal">
                <div class="card"><div class="card-header"><h2>Support Tickets</h2></div><div class="card-body">
                    <div class="empty"><i class="ri-customer-service-line"></i><p>No support tickets yet</p><p style="margin-top:8px;font-size:12px">Tickets from the SOS button and issue reports will appear here</p></div>
                </div></div>
                <div class="card"><div class="card-header"><h2>Quick Stats</h2></div><div class="card-body">
                    <div style="display:grid;gap:12px">
                        <div style="display:flex;justify-content:space-between;padding:12px;background:var(--bg);border-radius:10px"><span style="font-size:13px;color:var(--text-secondary)">Open Tickets</span><strong>0</strong></div>
                        <div style="display:flex;justify-content:space-between;padding:12px;background:var(--bg);border-radius:10px"><span style="font-size:13px;color:var(--text-secondary)">Avg Response Time</span><strong>-</strong></div>
                        <div style="display:flex;justify-content:space-between;padding:12px;background:var(--bg);border-radius:10px"><span style="font-size:13px;color:var(--text-secondary)">Resolved Today</span><strong>0</strong></div>
                        <div style="display:flex;justify-content:space-between;padding:12px;background:var(--bg);border-radius:10px"><span style="font-size:13px;color:var(--text-secondary)">SOS Alerts</span><strong>0</strong></div>
                    </div>
                </div></div>
            </div>
            <div class="card"><div class="card-header"><h2>Safety Overview</h2></div><div class="card-body">
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
                    <div style="text-align:center;padding:24px;background:var(--bg);border-radius:12px"><i class="ri-shield-check-line" style="font-size:32px;color:var(--success);display:block;margin-bottom:8px"></i><div style="font-weight:700;font-size:18px">100%</div><div style="font-size:12px;color:var(--text-secondary)">Rides Completed Safely</div></div>
                    <div style="text-align:center;padding:24px;background:var(--bg);border-radius:12px"><i class="ri-alarm-warning-line" style="font-size:32px;color:var(--warning);display:block;margin-bottom:8px"></i><div style="font-weight:700;font-size:18px">0</div><div style="font-size:12px;color:var(--text-secondary)">Incidents This Week</div></div>
                    <div style="text-align:center;padding:24px;background:var(--bg);border-radius:12px"><i class="ri-user-star-line" style="font-size:32px;color:var(--info);display:block;margin-bottom:8px"></i><div style="font-weight:700;font-size:18px">4.75</div><div style="font-size:12px;color:var(--text-secondary)">Avg Driver Rating</div></div>
                </div>
            </div></div>`;
    }

    // ==================== SETTINGS ====================
    function pageSettings() {
        main().innerHTML = `
            <div class="header"><h1>Settings</h1></div>
            <div class="grid-2-equal">
                <div class="card"><div class="card-header"><h2>General</h2></div><div class="card-body">
                    <div class="form-group"><label>Platform Name</label><input type="text" value="Famba"></div>
                    <div class="form-group"><label>Tagline</label><input type="text" value="Rides & Food Delivery in Zimbabwe"></div>
                    <div class="form-row">
                        <div class="form-group"><label>Currency</label><select><option selected>USD ($)</option><option>ZWL</option><option>ZiG</option></select></div>
                        <div class="form-group"><label>Country</label><input type="text" value="Zimbabwe" disabled></div>
                    </div>
                    <button class="btn btn-primary">Save Changes</button>
                </div></div>
                <div class="card"><div class="card-header"><h2>Ride Pricing</h2></div><div class="card-body">
                    <div class="form-row">
                        <div class="form-group"><label>Base Fare (USD)</label><input type="number" value="0.70" step="0.10"></div>
                        <div class="form-group"><label>Per KM Rate</label><input type="number" value="0.35" step="0.05"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Peak Multiplier</label><input type="number" value="1.15" step="0.05"></div>
                        <div class="form-group"><label>Multi-stop Fee</label><input type="number" value="0.50" step="0.10"></div>
                    </div>
                    <button class="btn btn-primary">Update Pricing</button>
                </div></div>
            </div>
            <div class="grid-2-equal" style="margin-top:0">
                <div class="card"><div class="card-header"><h2>Commission</h2></div><div class="card-body">
                    <div class="form-group"><label>Driver Commission Rate (%)</label><input type="number" value="15" min="0" max="50"></div>
                    <div class="form-group"><label>Food Delivery Commission (%)</label><input type="number" value="20" min="0" max="50"></div>
                    <button class="btn btn-primary">Save</button>
                </div></div>
                <div class="card"><div class="card-header"><h2>API & Integration</h2></div><div class="card-body">
                    <div style="display:grid;gap:12px">
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:10px"><div><strong style="font-size:13px">Backend API</strong><div style="font-size:12px;color:var(--text-secondary)">http://localhost:8000</div></div><span class="status active">Connected</span></div>
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:10px"><div><strong style="font-size:13px">SMS Provider</strong><div style="font-size:12px;color:var(--text-secondary)">Not configured</div></div><span class="status inactive">Off</span></div>
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:10px"><div><strong style="font-size:13px">Payment Gateway</strong><div style="font-size:12px;color:var(--text-secondary)">Not configured</div></div><span class="status inactive">Off</span></div>
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:10px"><div><strong style="font-size:13px">Maps (OSRM)</strong><div style="font-size:12px;color:var(--text-secondary)">router.project-osrm.org</div></div><span class="status active">Connected</span></div>
                    </div>
                </div></div>
            </div>`;
    }

    // ==================== INIT ====================
    pageDashboard();
    </script>
</body>
