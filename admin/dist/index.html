<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Famba Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #8BD17C;
            --primary-dark: #5BA34D;
            --primary-light: #e8f5e3;
            --bg: #f8faf7;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --purple: #a855f7;
            --sidebar-bg: #ffffff;
        }
        [data-theme="dark"] {
            --primary: #8BD17C;
            --primary-dark: #a3e896;
            --primary-light: #1a3a14;
            --bg: #0f1117;
            --surface: #1a1d27;
            --text: #e4e6eb;
            --text-secondary: #9ca3af;
            --border: #2d3140;
            --sidebar-bg: #151821;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }

        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; z-index: 100; overflow-y: auto; transition: background 0.3s; }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .logo-icon { width: 44px; height: 44px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
        .logo-text { font-size: 24px; font-weight: 700; color: var(--text); }
        .logo-text span { color: var(--text-secondary); font-size: 12px; font-weight: 500; display: block; }
        .nav-section { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); padding: 16px 16px 8px; letter-spacing: 0.5px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-radius: 10px; color: var(--text-secondary); text-decoration: none; margin-bottom: 2px; transition: all 0.2s; cursor: pointer; font-size: 14px; font-weight: 500; }
        .nav-item:hover { background: var(--primary-light); color: var(--primary-dark); }
        .nav-item.active { background: var(--primary); color: white; }
        .nav-item i { font-size: 20px; width: 24px; text-align: center; }
        .nav-item .badge { margin-left: auto; background: var(--error); color: white; font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
        .nav-item.active .badge { background: rgba(255,255,255,0.3); }
        .theme-toggle { margin-top: auto; padding: 12px 16px; border-radius: 10px; background: var(--bg); cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; color: var(--text-secondary); transition: all 0.2s; }
        .theme-toggle:hover { color: var(--text); }

        .main { margin-left: 260px; padding: 24px 32px; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header h1 { font-size: 26px; font-weight: 700; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn { padding: 9px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary-dark); }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
        .btn-danger { background: var(--error); color: white; }
        .btn-success { background: var(--success); color: white; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--surface); border-radius: 14px; padding: 20px; border: 1px solid var(--border); transition: background 0.3s; }
        .stat-card .icon { width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 14px; }
        .stat-card .icon.green { background: #dcfce7; color: var(--success); }
        .stat-card .icon.blue { background: #dbeafe; color: var(--info); }
        .stat-card .icon.orange { background: #fef3c7; color: var(--warning); }
        .stat-card .icon.purple { background: #f3e8ff; color: var(--purple); }
        .stat-card .icon.red { background: #fee2e2; color: var(--error); }
        .stat-card .value { font-size: 28px; font-weight: 700; margin-bottom: 2px; }
        .stat-card .label { color: var(--text-secondary); font-size: 13px; }
        [data-theme="dark"] .stat-card .icon.green { background: #064e3b; } [data-theme="dark"] .stat-card .icon.blue { background: #1e3a5f; } [data-theme="dark"] .stat-card .icon.orange { background: #78350f; } [data-theme="dark"] .stat-card .icon.purple { background: #3b0764; } [data-theme="dark"] .stat-card .icon.red { background: #7f1d1d; }

        .card { background: var(--surface); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; transition: background 0.3s; }
        .card-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-header h2 { font-size: 16px; font-weight: 600; }
        .card-body { padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 18px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--bg); font-weight: 600; font-size: 11px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.3px; }
        td { font-size: 13px; }
        tr:last-child td { border-bottom: none; }
        .status { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .status.searching, .status.placed, .status.open, .status.pending { background: #fef3c7; color: #b45309; }
        .status.driver_assigned, .status.confirmed, .status.investigating { background: #dbeafe; color: #1d4ed8; }
        .status.enroute, .status.preparing, .status.picked_up, .status.delivering { background: #e0e7ff; color: #4338ca; }
        .status.arrived, .status.ready { background: #d1fae5; color: #065f46; }
        .status.riding { background: #dcfce7; color: var(--success); }
        .status.complete, .status.delivered, .status.resolved, .status.approved { background: #dcfce7; color: #166534; }
        .status.cancelled, .status.rejected { background: #fee2e2; color: var(--error); }
        .status.scheduled, .status.active { background: #dcfce7; color: var(--success); }
        .status.inactive { background: #f3f4f6; color: var(--text-secondary); }
        .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: white; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
        .user-cell { display: flex; align-items: center; gap: 10px; }

        .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        .grid-2-equal { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }

        .empty { text-align: center; padding: 48px 20px; color: var(--text-secondary); }
        .empty i { font-size: 48px; margin-bottom: 12px; display: block; opacity: 0.3; }
        .empty p { font-size: 14px; }
        .loading-row td { text-align: center; padding: 32px; color: var(--text-secondary); font-size: 13px; }

        .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--primary-dark); border-bottom-color: var(--primary); }

        .rest-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; transition: all 0.2s; }
        .rest-card:hover { border-color: var(--primary); }
        .rest-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .rest-card .meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
        .rest-card .rest-stats { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); }
        .rest-card .rest-stats span { display: flex; align-items: center; gap: 4px; }
        .rest-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--primary-light); color: var(--primary-dark); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: var(--text); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text); }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .chart-container { position: relative; height: 280px; }
        .surge-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 13px; }
        .surge-badge.active { background: #fef3c7; color: #b45309; }
        .surge-badge.normal { background: #dcfce7; color: #166534; }

        @media (max-width: 1200px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .grid-2, .grid-2-equal { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; padding: 16px; } .stats-grid { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="ri-motorbike-fill"></i></div>
            <div class="logo-text">Famba<span>Admin Panel</span></div>
        </div>
        <nav>
            <div class="nav-section">Overview</div>
            <a class="nav-item active" data-page="dashboard"><i class="ri-dashboard-line"></i> Dashboard</a>

            <div class="nav-section">Ride-Hailing</div>
            <a class="nav-item" data-page="rides"><i class="ri-route-line"></i> Rides</a>
            <a class="nav-item" data-page="drivers"><i class="ri-user-star-line"></i> Drivers</a>

            <div class="nav-section">Food Delivery</div>
            <a class="nav-item" data-page="restaurants"><i class="ri-store-2-line"></i> Restaurants</a>
            <a class="nav-item" data-page="food-orders"><i class="ri-shopping-bag-line"></i> Food Orders</a>
            <a class="nav-item" href="restaurant.html" target="_blank" style="color:var(--warning)"><i class="ri-external-link-line"></i> Restaurant Portal ↗</a>

            <div class="nav-section">Users & Revenue</div>
            <a class="nav-item" data-page="riders"><i class="ri-user-line"></i> Users</a>
            <a class="nav-item" data-page="earnings"><i class="ri-money-dollar-circle-line"></i> Earnings</a>
            <a class="nav-item" data-page="promos"><i class="ri-coupon-line"></i> Promo Codes</a>

            <div class="nav-section">Operations</div>
            <a class="nav-item" data-page="disputes"><i class="ri-shield-line"></i> Disputes</a>
            <a class="nav-item" data-page="verification"><i class="ri-file-check-line"></i> Verification</a>
            <a class="nav-item" data-page="surge"><i class="ri-flashlight-line"></i> Surge Pricing</a>
            <a class="nav-item" data-page="withdrawals"><i class="ri-bank-card-line"></i> Withdrawals</a>
            <a class="nav-item" data-page="settings"><i class="ri-settings-line"></i> Settings</a>
        </nav>
        <div class="theme-toggle" onclick="toggleTheme()">
            <i class="ri-moon-line" id="theme-icon"></i> <span id="theme-label">Dark Mode</span>
        </div>
    </aside>

    <main class="main" id="main-content"></main>

    <script>
    const API = 'http://localhost:8000';
    const AUTH = 'Basic ' + btoa('demo:demo123');

    async function apiFetch(endpoint, opts = {}) {
        try {
            const res = await fetch(`${API}${endpoint}`, {
                headers: { 'Authorization': AUTH, 'Content-Type': 'application/json', ...opts.headers },
                ...opts,
            });
            return await res.json();
        } catch (e) { console.error('API Error:', e); return null; }
    }
    async function apiPost(endpoint, body) {
        return apiFetch(endpoint, { method: 'POST', body: JSON.stringify(body) });
    }

    let cachedStats = null;
    const $ = id => document.getElementById(id);
    const main = () => $('main-content');

    // ==================== THEME ====================
    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
        localStorage.setItem('famba-theme', isDark ? 'light' : 'dark');
        $('theme-icon').className = isDark ? 'ri-moon-line' : 'ri-sun-line';
        $('theme-label').textContent = isDark ? 'Dark Mode' : 'Light Mode';
        // Destroy and recreate charts if on dashboard
        if (document.querySelector('.chart-container canvas')) pageDashboard();
    }
    (function initTheme() {
        const saved = localStorage.getItem('famba-theme');
        if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            setTimeout(() => { $('theme-icon').className = 'ri-sun-line'; $('theme-label').textContent = 'Light Mode'; }, 0);
        }
    })();

    // ==================== ROUTER ====================
    function navigate(page) {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        const active = document.querySelector(`.nav-item[data-page="${page}"]`);
        if (active) active.classList.add('active');
        const pages = { dashboard: pageDashboard, rides: pageRides, drivers: pageDrivers, riders: pageRiders, earnings: pageEarnings, promos: pagePromos, restaurants: pageRestaurants, 'food-orders': pageFoodOrders, disputes: pageDisputes, verification: pageVerification, surge: pageSurge, withdrawals: pageWithdrawals, settings: pageSettings };
        (pages[page] || pageDashboard)();
    }
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => navigate(item.dataset.page));
    });

    // ==================== HELPERS ====================
    function statusBadge(s) { return `<span class="status ${s}">${(s||'').replace('_', ' ')}</span>`; }
    function avatarCell(name, sub) {
        const initial = (name || '?')[0].toUpperCase();
        return `<div class="user-cell"><div class="avatar">${initial}</div><div><div style="font-weight:500">${name || '-'}</div>${sub ? `<small style="color:var(--text-secondary)">${sub}</small>` : ''}</div></div>`;
    }
    function money(v) { return `$${(v || 0).toFixed(2)}`; }
    function timeAgo(iso) {
        if (!iso) return '-';
        const d = new Date(iso), now = new Date(), diff = (now - d) / 1000;
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        return d.toLocaleDateString();
    }
    function chartColors() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        return { grid: isDark ? '#2d3140' : '#e5e7eb', text: isDark ? '#9ca3af' : '#6b7280' };
    }

    // ==================== DASHBOARD ====================
    async function pageDashboard() {
        main().innerHTML = `
            <div class="header"><h1>Dashboard</h1><div class="header-actions"><button class="btn btn-primary" onclick="pageDashboard()"><i class="ri-refresh-line"></i> Refresh</button></div></div>
            <div class="stats-grid" id="dash-stats"><div class="stat-card"><div style="padding:20px;color:var(--text-secondary)">Loading...</div></div></div>
            <div class="grid-2-equal">
                <div class="card"><div class="card-header"><h2>Revenue Trend</h2></div><div class="card-body"><div class="chart-container"><canvas id="chart-revenue"></canvas></div></div></div>
                <div class="card"><div class="card-header"><h2>Orders by Type</h2></div><div class="card-body"><div class="chart-container"><canvas id="chart-orders"></canvas></div></div></div>
            </div>
            <div class="grid-2"><div class="card"><div class="card-header"><h2>Recent Rides</h2><button class="btn btn-outline btn-sm" onclick="navigate('rides')">View All</button></div><table><thead><tr><th>ID</th><th>Rider</th><th>Route</th><th>Fare</th><th>Status</th></tr></thead><tbody id="dash-rides"><tr><td colspan="5" class="loading-row">Loading...</td></tr></tbody></table></div>
            <div class="card"><div class="card-header"><h2>Recent Food Orders</h2><button class="btn btn-outline btn-sm" onclick="navigate('food-orders')">View All</button></div><table><thead><tr><th>Order</th><th>Total</th><th>Status</th></tr></thead><tbody id="dash-food"><tr><td colspan="3" class="loading-row">Loading...</td></tr></tbody></table></div></div>`;

        const stats = await apiFetch('/admin/stats');
        if (!stats) return;
        cachedStats = stats;
        const surge = await apiFetch('/surge');

        $('dash-stats').innerHTML = `
            <div class="stat-card"><div class="icon green"><i class="ri-money-dollar-circle-line"></i></div><div class="value">${money(stats.total_revenue)}</div><div class="label">Total Revenue</div></div>
            <div class="stat-card"><div class="icon blue"><i class="ri-route-line"></i></div><div class="value">${stats.total_rides}</div><div class="label">Rides</div></div>
            <div class="stat-card"><div class="icon orange"><i class="ri-shopping-bag-line"></i></div><div class="value">${stats.total_food_orders}</div><div class="label">Food Orders</div></div>
            <div class="stat-card"><div class="icon ${surge?.is_surge ? 'red' : 'purple'}"><i class="ri-flashlight-line"></i></div><div class="value">${surge?.multiplier || '1.0'}x</div><div class="label">${surge?.is_surge ? 'Surge Active' : 'Normal Pricing'}</div></div>`;

        const rides = stats.recent_rides || [];
        $('dash-rides').innerHTML = rides.length === 0 ? '<tr><td colspan="5" class="loading-row">No rides yet</td></tr>' :
            rides.slice(0, 5).map(j => `<tr><td><strong>${j.id}</strong></td><td>${j.rider_name||'-'}</td><td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${j.pickup_text||''} &rarr; ${j.drop_text||''}</td><td>${money(j.fare_usd)}</td><td>${statusBadge(j.status)}</td></tr>`).join('');

        const orders = stats.recent_food_orders || [];
        $('dash-food').innerHTML = orders.length === 0 ? '<tr><td colspan="3" class="loading-row">No orders yet</td></tr>' :
            orders.slice(0, 5).map(o => `<tr><td><strong>${o.id}</strong></td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td></tr>`).join('');

        // Charts
        const cc = chartColors();
        const chartOpts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: cc.text } } }, scales: { x: { ticks: { color: cc.text }, grid: { color: cc.grid } }, y: { ticks: { color: cc.text }, grid: { color: cc.grid } } } };

        new Chart($('chart-revenue'), {
            type: 'bar',
            data: {
                labels: ['Rides', 'Food', 'Total'],
                datasets: [{
                    label: 'Revenue (USD)',
                    data: [stats.ride_revenue, stats.food_revenue, stats.total_revenue],
                    backgroundColor: ['#3b82f6', '#f59e0b', '#8BD17C'],
                    borderRadius: 8,
                }]
            },
            options: { ...chartOpts, plugins: { ...chartOpts.plugins, legend: { display: false } } }
        });

        new Chart($('chart-orders'), {
            type: 'doughnut',
            data: {
                labels: ['Rides', 'Food Orders'],
                datasets: [{
                    data: [stats.total_rides || 1, stats.total_food_orders || 1],
                    backgroundColor: ['#3b82f6', '#f59e0b'],
                    borderWidth: 0,
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: cc.text, padding: 16 } } } }
        });
    }

    // ==================== RIDES ====================
    async function pageRides() {
        main().innerHTML = `
            <div class="header"><h1>Rides</h1><div class="header-actions"><button class="btn btn-primary" onclick="pageRides()"><i class="ri-refresh-line"></i> Refresh</button></div></div>
            <div class="card"><table><thead><tr><th>ID</th><th>Rider</th><th>Driver</th><th>Pickup</th><th>Dropoff</th><th>Dist</th><th>Fare</th><th>Payment</th><th>Status</th><th>Created</th></tr></thead><tbody id="rides-body"><tr><td colspan="10" class="loading-row">Loading...</td></tr></tbody></table></div>`;
        const jobs = await apiFetch('/jobs');
        if (!jobs || !Array.isArray(jobs) || jobs.length === 0) { $('rides-body').innerHTML = '<tr><td colspan="10" class="loading-row">No rides found</td></tr>'; return; }
        $('rides-body').innerHTML = jobs.map(j => `<tr><td><strong>${j.id}</strong></td><td>${avatarCell(j.rider_name)}</td><td>${j.driver?.name||'-'}</td><td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${j.pickup_text||'-'}</td><td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${j.drop_text||'-'}</td><td>${j.distance_km?j.distance_km.toFixed(1)+' km':'-'}</td><td><strong>${money(j.fare_usd)}</strong></td><td>${j.payment_method||'cash'}</td><td>${statusBadge(j.status)}</td><td>${timeAgo(j.created_at)}</td></tr>`).join('');
    }

    // ==================== DRIVERS ====================
    async function pageDrivers() {
        main().innerHTML = `<div class="header"><h1>Drivers</h1><div class="header-actions"><button class="btn btn-primary" onclick="pageDrivers()"><i class="ri-refresh-line"></i> Refresh</button></div></div><div class="stats-grid" id="driver-stats"></div><div class="card"><table><thead><tr><th>Driver</th><th>Vehicle</th><th>Plate</th><th>Rating</th><th>Trips</th><th>Earnings</th><th>Verified</th><th>Status</th></tr></thead><tbody id="drivers-body"><tr><td colspan="8" class="loading-row">Loading...</td></tr></tbody></table></div>`;
        const [driversRes, leaderboard] = await Promise.all([apiFetch('/drivers'), apiFetch('/drivers/earnings/leaderboard')]);

        const tbody = document.getElementById('wd-body');
        if (!wds.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--text-secondary)">No pending withdrawals</td></tr>'; return; }
        tbody.innerHTML = wds.map(w => `<tr><td>#${w.id}</td><td>${w.driver_id}</td><td><strong>$${w.amount.toFixed(2)}</strong></td><td><span class="badge badge-${w.method==='ecocash'?'green':w.method==='innbucks'?'blue':'purple'}">${w.method}</span></td><td>${w.account_number}</td><td><span class="badge badge-yellow">${w.status}</span></td><td>${formatDate(w.created_at)}</td><td><button class="btn btn-sm btn-success" onclick="processWd(${w.id},'completed')">Approve</button> <button class="btn btn-sm btn-danger" onclick="processWd(${w.id},'failed')">Reject</button></td></tr>`).join('');
    }
    window.processWd = async function(id, status) {
        const ref = status === 'completed' ? prompt('Reference number (optional):','') : null;
        await apiPost(`/admin/withdrawals/${id}/process`, { status, reference: ref });
        pageWithdrawals();
    };

    // ==================== SETTINGS ====================
    function pageSettings() {
        main().innerHTML = `<div class="header"><h1>Settings</h1></div><div class="grid-2-equal"><div class="card"><div class="card-header"><h2>General</h2></div><div class="card-body"><div class="form-group"><label>Platform Name</label><input type="text" value="Famba"></div><div class="form-group"><label>Tagline</label><input type="text" value="Rides & Food Delivery in Zimbabwe"></div><div class="form-row"><div class="form-group"><label>Currency</label><select><option selected>USD ($)</option><option>ZWL</option><option>ZiG</option></select></div><div class="form-group"><label>Country</label><input type="text" value="Zimbabwe" disabled></div></div><button class="btn btn-primary">Save</button></div></div><div class="card"><div class="card-header"><h2>Ride Pricing</h2></div><div class="card-body"><div class="form-row"><div class="form-group"><label>Base Fare</label><input type="number" value="0.70" step="0.10"></div><div class="form-group"><label>Per KM</label><input type="number" value="0.35" step="0.05"></div></div><div class="form-row"><div class="form-group"><label>Peak Multiplier</label><input type="number" value="1.30" step="0.05"></div><div class="form-group"><label>Stop Fee</label><input type="number" value="0.50" step="0.10"></div></div><button class="btn btn-primary">Update</button></div></div></div><div class="grid-2-equal" style="margin-top:0"><div class="card"><div class="card-header"><h2>Commission</h2></div><div class="card-body"><div class="form-group"><label>Driver Commission (%)</label><input type="number" value="15" min="0" max="50"></div><div class="form-group"><label>Food Commission (%)</label><input type="number" value="20" min="0" max="50"></div><button class="btn btn-primary">Save</button></div></div><div class="card"><div class="card-header"><h2>API Status</h2></div><div class="card-body"><div style="display:grid;gap:12px"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:10px"><div><strong style="font-size:13px">Backend API</strong><div style="font-size:12px;color:var(--text-secondary)">localhost:8000</div></div><span class="status active">Connected</span></div><div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:10px"><div><strong style="font-size:13px">SMS Provider</strong></div><span class="status inactive">Off</span></div><div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:10px"><div><strong style="font-size:13px">Payments</strong></div><span class="status inactive">Off</span></div><div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:10px"><div><strong style="font-size:13px">Maps (OSRM)</strong></div><span class="status active">Connected</span></div></div></div></div></div>`;
    }

    // ==================== INIT ====================
    pageDashboard();
    </script>
