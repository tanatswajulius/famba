<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Famba — Restaurant Portal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f5f5;--card:#fff;--text:#222;--muted:#888;
  --border:#e8e8e8;--primary:#ff6600;--primary-light:#fff3e6;
  --sidebar:#1a1a2e;--sidebar-text:#ccc;--sidebar-active:#ff6600;
  --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;
}
[data-theme="dark"]{
  --bg:#0f0f23;--card:#1a1a2e;--text:#e8e8e8;--muted:#888;
  --border:#2a2a4a;--primary-light:#2a1a0e;
  --sidebar:#0a0a1a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}

.sidebar{width:240px;background:var(--sidebar);color:var(--sidebar-text);padding:24px 0;position:fixed;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.sidebar .logo{text-align:center;padding:0 20px 24px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .logo h2{color:#fff;font-size:20px}
.sidebar .logo small{color:var(--primary);font-size:12px}
.sidebar nav{flex:1;padding:16px 0}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:12px 24px;color:var(--sidebar-text);text-decoration:none;font-size:14px;transition:.2s}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,102,0,.15);color:#fff;border-right:3px solid var(--sidebar-active)}
.sidebar .bottom{padding:16px 24px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}

.main{margin-left:240px;flex:1;padding:24px 32px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.topbar h1{font-size:22px}
.topbar .actions{display:flex;gap:10px;align-items:center}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fde8e8;color:#991b1b}
.badge-yellow{background:#fef9c3;color:#854d0e}
.badge-blue{background:#dbeafe;color:#1e40af}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;transition:.2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.stat-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:28px;font-weight:700;margin:4px 0}
.stat-card .sub{font-size:12px;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.card h3{margin-bottom:16px;font-size:16px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid var(--border)}

.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{opacity:.9}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-yellow{background:var(--yellow);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}

input,select,textarea{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--card);color:var(--text);width:100%}
textarea{resize:vertical;min-height:60px}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}

.toggle{position:relative;width:44px;height:24px;display:inline-block}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;background:#ccc;border-radius:24px;cursor:pointer;transition:.3s}
.toggle .slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:var(--primary)}
.toggle input:checked+.slider:before{transform:translateX(20px)}

.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.order-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative}
.order-card .order-id{font-weight:700;font-size:15px}
.order-card .order-time{font-size:12px;color:var(--muted)}
.order-card .order-items{margin:10px 0;font-size:13px;line-height:1.6}
.order-card .order-total{font-weight:700;font-size:16px;color:var(--primary)}
.order-card .order-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

.chart-wrap{height:260px;position:relative}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px}
.tab{padding:10px 20px;border:none;background:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

.empty{text-align:center;padding:40px;color:var(--muted)}

@media(max-width:768px){
  .sidebar{width:60px}.sidebar .logo small,.sidebar nav a span,.sidebar .bottom span{display:none}
  .sidebar nav a{justify-content:center;padding:12px 0}
  .main{margin-left:60px;padding:16px}
  .stats{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  .orders-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <h2>🍽️ Famba</h2>
    <small>Restaurant Portal</small>
  </div>
  <nav id="nav">
    <a href="#" onclick="page('dashboard')" class="active" id="nav-dashboard">📊 <span>Dashboard</span></a>
    <a href="#" onclick="page('orders')" id="nav-orders">📋 <span>Orders</span></a>
    <a href="#" onclick="page('menu')" id="nav-menu">🍔 <span>Menu</span></a>
    <a href="#" onclick="page('ratings')" id="nav-ratings">⭐ <span>Ratings</span></a>
    <a href="#" onclick="page('settings')" id="nav-settings">⚙️ <span>Settings</span></a>
  </nav>
  <div class="bottom">
    <span id="restaurantName">—</span><br>
    <a href="#" onclick="logout()" style="color:var(--primary);font-size:12px">Sign out</a>
    <label class="toggle" style="float:right" title="Dark mode">
      <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
      <span class="slider"></span>
    </label>
  </div>
</div>

<div class="main" id="content">
  <!-- login -->
  <div id="loginView" style="max-width:400px;margin:80px auto">
    <div class="card">
      <h3>Restaurant Portal Login</h3>
      <div class="form-group"><label>Phone</label><input id="loginPhone" placeholder="0771234567"></div>
      <div class="form-group"><label>Password</label><input id="loginPass" type="password" placeholder="Password"></div>
      <div class="form-group"><label>Restaurant ID</label><input id="loginRestId" placeholder="e.g. rest_01"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doLogin()">Sign In</button>
      <p id="loginError" style="color:var(--red);font-size:13px;margin-top:8px"></p>
    </div>
  </div>
  <div id="appView" style="display:none"></div>
</div>

<script>
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://127.0.0.1:8000' : '';

let token = localStorage.getItem('rp_token') || '';
let restId = localStorage.getItem('rp_rest_id') || '';
let restName = '';

function hdr() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }; }
async function api(path, opts = {}) {
  const r = await fetch(API + path, { headers: hdr(), ...opts });
  if (r.status === 401) { logout(); throw new Error('Unauthorized'); }
  return r.json();
}

function initTheme() {
  const t = localStorage.getItem('rp_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeToggle').checked = t === 'dark';
}
function toggleTheme() {
  const d = document.getElementById('themeToggle').checked ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', d);
  localStorage.setItem('rp_theme', d);
}

async function doLogin() {
  const phone = document.getElementById('loginPhone').value.trim();
  const pass = document.getElementById('loginPass').value;
  restId = document.getElementById('loginRestId').value.trim();
  document.getElementById('loginError').textContent = '';
  try {
    const r = await fetch(API + '/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, password: pass })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Login failed');
    token = data.access_token;
    localStorage.setItem('rp_token', token);
    localStorage.setItem('rp_rest_id', restId);
    init();
  } catch (e) { document.getElementById('loginError').textContent = e.message; }
}
function logout() {
  token = ''; restId = '';
  localStorage.removeItem('rp_token');
  localStorage.removeItem('rp_rest_id');
  document.getElementById('loginView').style.display = '';
  document.getElementById('appView').style.display = 'none';
}

async function init() {
  if (!token || !restId) return;
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = '';
  try {
    const stats = await api(`/restaurant-portal/${restId}/dashboard`);
    restName = stats.name || restId;
    document.getElementById('restaurantName').textContent = restName;
  } catch { restName = restId; }
  page('dashboard');
}

function page(p) {
  document.querySelectorAll('#nav a').forEach(a => a.classList.remove('active'));
  const el = document.getElementById('nav-' + p);
  if (el) el.classList.add('active');
  const pages = { dashboard: pageDashboard, orders: pageOrders, menu: pageMenu, ratings: pageRatings, settings: pageSettings };
  if (pages[p]) pages[p]();
}

async function pageDashboard() {
  const v = document.getElementById('appView');
  v.innerHTML = '<div class="topbar"><h1>Dashboard</h1></div><div class="stats" id="statsGrid"></div><div class="card"><h3>Recent Orders</h3><div id="recentOrders">Loading…</div></div>';
  try {
    const s = await api(`/restaurant-portal/${restId}/dashboard`);
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="label">Today's Orders</div><div class="value">${s.today_orders}</div></div>
      <div class="stat-card"><div class="label">Active Orders</div><div class="value" style="color:var(--primary)">${s.active_orders}</div></div>
      <div class="stat-card"><div class="label">Today's Revenue</div><div class="value">$${s.today_revenue.toFixed(2)}</div></div>
      <div class="stat-card"><div class="label">Total Revenue</div><div class="value">$${s.total_revenue.toFixed(2)}</div></div>
      <div class="stat-card"><div class="label">Total Orders</div><div class="value">${s.total_orders}</div></div>
      <div class="stat-card"><div class="label">Rating</div><div class="value">⭐ ${s.rating}</div></div>
    `;
    const ord = await api(`/restaurant-portal/${restId}/orders?limit=5`);
    if (!ord.orders?.length) { document.getElementById('recentOrders').innerHTML = '<div class="empty">No orders yet</div>'; return; }
    document.getElementById('recentOrders').innerHTML = '<table><thead><tr><th>ID</th><th>Status</th><th>Items</th><th>Total</th><th>Time</th></tr></thead><tbody>' +
      ord.orders.map(o => `<tr><td>${o.id.slice(0,8)}</td><td>${statusBadge(o.status)}</td><td>${(o.items||[]).length} items</td><td>$${(o.total||0).toFixed(2)}</td><td>${timeAgo(o.created_at)}</td></tr>`).join('') +
      '</tbody></table>';
  } catch (e) { v.innerHTML += `<p style="color:var(--red)">${e.message}</p>`; }
}

async function pageOrders() {
  const v = document.getElementById('appView');
  v.innerHTML = `<div class="topbar"><h1>Orders</h1><div class="actions">
    <div class="tabs"><button class="tab active" onclick="filterOrders(null,this)">All</button>
    <button class="tab" onclick="filterOrders('placed',this)">New</button>
    <button class="tab" onclick="filterOrders('confirmed',this)">Confirmed</button>
    <button class="tab" onclick="filterOrders('preparing',this)">Preparing</button>
    <button class="tab" onclick="filterOrders('ready',this)">Ready</button>
    </div></div></div><div class="orders-grid" id="ordersGrid">Loading…</div>`;
  filterOrders(null, document.querySelector('.tab'));
}
window.filterOrders = async function(status, btn) {
  if (btn) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); btn.classList.add('active'); }
  const url = `/restaurant-portal/${restId}/orders` + (status ? `?status=${status}` : '');
  const data = await api(url);
  const g = document.getElementById('ordersGrid');
  if (!data.orders?.length) { g.innerHTML = '<div class="empty">No orders</div>'; return; }
  g.innerHTML = data.orders.map(o => `
    <div class="order-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="order-id">#${o.id.slice(0,8)}</span>
        ${statusBadge(o.status)}
      </div>
      <div class="order-time">${timeAgo(o.created_at)}</div>
      <div class="order-items">${(o.items||[]).map(i=>`${i.qty||1}× ${i.name}`).join('<br>')}</div>
      ${o.special_instructions ? `<div style="font-size:12px;color:var(--yellow)">📝 ${o.special_instructions}</div>` : ''}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
        <span class="order-total">$${(o.total||0).toFixed(2)}</span>
        <div class="order-actions">${orderActions(o)}</div>
      </div>
    </div>`).join('');
};
function orderActions(o) {
  const s = o.status;
  if (s === 'placed') return `<button class="btn btn-sm btn-green" onclick="updateOrder('${o.id}','confirmed')">Accept</button><button class="btn btn-sm btn-red" onclick="updateOrder('${o.id}','cancelled')">Reject</button>`;
  if (s === 'confirmed') return `<button class="btn btn-sm btn-yellow" onclick="updateOrder('${o.id}','preparing')">Start Preparing</button>`;
  if (s === 'preparing') return `<button class="btn btn-sm btn-blue" onclick="updateOrder('${o.id}','ready')">Mark Ready</button>`;
  return '';
}
window.updateOrder = async function(oid, status) {
  await api(`/restaurant-portal/${restId}/orders/${oid}/status`, { method: 'POST', body: JSON.stringify({ status }) });
  filterOrders(null, document.querySelector('.tab.active'));
};

async function pageMenu() {
  const v = document.getElementById('appView');
  v.innerHTML = `<div class="topbar"><h1>Menu</h1><div class="actions"><button class="btn btn-primary" onclick="showAddItem()">+ Add Item</button></div></div>
    <div id="menuModal" style="display:none" class="card"></div>
    <div id="menuList">Loading…</div>`;
  const data = await api(`/restaurant-portal/${restId}/menu`);
  const items = data.menu || [];
  if (!items.length) { document.getElementById('menuList').innerHTML = '<div class="empty">No menu items. Click "+ Add Item" to start.</div>'; return; }
  const cats = {};
  items.forEach(i => { const c = i.category || 'other'; if (!cats[c]) cats[c] = []; cats[c].push(i); });
  let html = '';
  for (const [cat, its] of Object.entries(cats)) {
    html += `<div class="card"><h3 style="text-transform:capitalize">${cat}</h3><table><thead><tr><th>Name</th><th>Price</th><th>Available</th><th>Popular</th><th>Actions</th></tr></thead><tbody>`;
    its.forEach(i => {
      html += `<tr><td><strong>${i.name}</strong><br><span style="font-size:12px;color:var(--muted)">${i.description||''}</span></td>
        <td>$${i.price.toFixed(2)}</td>
        <td>${i.is_available ? '<span class="badge badge-green">Yes</span>' : '<span class="badge badge-red">No</span>'}</td>
        <td>${i.is_popular ? '🔥' : ''}</td>
        <td><button class="btn btn-sm btn-outline" onclick='editItem(${JSON.stringify(i)})'>Edit</button> <button class="btn btn-sm btn-red" onclick="deleteItem(${i.id})">×</button></td></tr>`;
    });
    html += '</tbody></table></div>';
  }
  document.getElementById('menuList').innerHTML = html;
}
window.showAddItem = function() {
  const m = document.getElementById('menuModal');
  m.style.display = '';
  m.innerHTML = `<h3>Add Menu Item</h3>
    <div class="form-row"><div class="form-group"><label>Name</label><input id="miName"></div><div class="form-group"><label>Price ($)</label><input id="miPrice" type="number" step="0.01"></div></div>
    <div class="form-group"><label>Description</label><textarea id="miDesc"></textarea></div>
    <div class="form-row"><div class="form-group"><label>Category</label><select id="miCat"><option>main</option><option>side</option><option>drink</option><option>dessert</option><option>combo</option></select></div>
    <div class="form-group"><label>Image URL</label><input id="miImg"></div></div>
    <button class="btn btn-primary" onclick="saveNewItem()">Save</button> <button class="btn btn-outline" onclick="document.getElementById('menuModal').style.display='none'">Cancel</button>`;
};
window.editItem = function(item) {
  const m = document.getElementById('menuModal');
  m.style.display = '';
  m.innerHTML = `<h3>Edit: ${item.name}</h3>
    <div class="form-row"><div class="form-group"><label>Name</label><input id="miName" value="${item.name}"></div><div class="form-group"><label>Price ($)</label><input id="miPrice" type="number" step="0.01" value="${item.price}"></div></div>
    <div class="form-group"><label>Description</label><textarea id="miDesc">${item.description||''}</textarea></div>
    <div class="form-row"><div class="form-group"><label>Category</label><select id="miCat">${['main','side','drink','dessert','combo'].map(c=>`<option ${c===item.category?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="form-group"><label>Image URL</label><input id="miImg" value="${item.image_url||''}"></div></div>
    <div class="form-row"><div class="form-group"><label><input type="checkbox" id="miAvail" ${item.is_available?'checked':''}> Available</label></div>
    <div class="form-group"><label><input type="checkbox" id="miPop" ${item.is_popular?'checked':''}> Popular</label></div></div>
    <button class="btn btn-primary" onclick="saveEditItem(${item.id})">Save</button> <button class="btn btn-outline" onclick="document.getElementById('menuModal').style.display='none'">Cancel</button>`;
};
window.saveNewItem = async function() {
  const data = { name: document.getElementById('miName').value, price: parseFloat(document.getElementById('miPrice').value), description: document.getElementById('miDesc').value, category: document.getElementById('miCat').value, image_url: document.getElementById('miImg').value };
  await api(`/restaurant-portal/${restId}/menu`, { method: 'POST', body: JSON.stringify(data) });
  pageMenu();
};
window.saveEditItem = async function(id) {
  const data = { name: document.getElementById('miName').value, price: parseFloat(document.getElementById('miPrice').value), description: document.getElementById('miDesc').value, category: document.getElementById('miCat').value, image_url: document.getElementById('miImg').value, is_available: document.getElementById('miAvail').checked, is_popular: document.getElementById('miPop').checked };
  await api(`/restaurant-portal/${restId}/menu/${id}`, { method: 'PUT', body: JSON.stringify(data) });
  pageMenu();
};
window.deleteItem = async function(id) {
  if (!confirm('Delete this item?')) return;
  await api(`/restaurant-portal/${restId}/menu/${id}`, { method: 'DELETE' });
  pageMenu();
};

async function pageRatings() {
  const v = document.getElementById('appView');
  v.innerHTML = '<div class="topbar"><h1>Customer Ratings</h1></div><div id="ratingsList">Loading…</div>';
  const data = await api(`/restaurant-portal/${restId}/ratings`);
  const ratings = data.ratings || [];
  if (!ratings.length) { document.getElementById('ratingsList').innerHTML = '<div class="empty">No ratings yet</div>'; return; }
  document.getElementById('ratingsList').innerHTML = '<div class="card"><table><thead><tr><th>Food</th><th>Delivery</th><th>Comment</th><th>Date</th></tr></thead><tbody>' +
    ratings.map(r => `<tr><td>${'⭐'.repeat(Math.round(r.food_rating))}</td><td>${r.delivery_rating ? '⭐'.repeat(Math.round(r.delivery_rating)) : '—'}</td><td>${r.comment||'—'}</td><td>${timeAgo(r.created_at)}</td></tr>`).join('') +
    '</tbody></table></div>';
}

async function pageSettings() {
  const v = document.getElementById('appView');
  v.innerHTML = '<div class="topbar"><h1>Restaurant Settings</h1></div><div class="card" id="settingsForm">Loading…</div>';
  const r = await api(`/restaurants/${restId}`);
  document.getElementById('settingsForm').innerHTML = `
    <div class="form-row"><div class="form-group"><label>Name</label><input id="sName" value="${r.name||''}"></div><div class="form-group"><label>Phone</label><input id="sPhone" value="${r.phone||''}"></div></div>
    <div class="form-group"><label>Description</label><textarea id="sDesc">${r.description||''}</textarea></div>
    <div class="form-group"><label>Address</label><input id="sAddr" value="${r.address||''}"></div>
    <div class="form-row"><div class="form-group"><label>Cuisine</label><input id="sCuisine" value="${r.cuisine||''}"></div><div class="form-group"><label>Image URL</label><input id="sImg" value="${r.image_url||''}"></div></div>
    <div class="form-row">
      <div class="form-group"><label>Opening</label><input id="sOpen" type="time" value="${r.opening_time||'08:00'}"></div>
      <div class="form-group"><label>Closing</label><input id="sClose" type="time" value="${r.closing_time||'22:00'}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Delivery Fee ($)</label><input id="sFee" type="number" step="0.10" value="${r.delivery_fee||1}"></div>
      <div class="form-group"><label>Min Order ($)</label><input id="sMin" type="number" step="0.50" value="${r.min_order||2}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Avg Prep Time (min)</label><input id="sPrep" type="number" value="${r.avg_prep_time_min||25}"></div>
      <div class="form-group"><label>Currently Open</label><label class="toggle" style="margin-top:6px"><input type="checkbox" id="sIsOpen" ${r.is_open?'checked':''}><span class="slider"></span></label></div>
    </div>
    <button class="btn btn-primary" onclick="saveSettings()" style="margin-top:8px">Save Changes</button>
    <span id="settingsSaved" style="color:var(--green);margin-left:12px;font-size:13px"></span>`;
}
window.saveSettings = async function() {
  const data = {
    name: document.getElementById('sName').value,
    phone: document.getElementById('sPhone').value,
    description: document.getElementById('sDesc').value,
    address: document.getElementById('sAddr').value,
    cuisine: document.getElementById('sCuisine').value,
    image_url: document.getElementById('sImg').value,
    opening_time: document.getElementById('sOpen').value,
    closing_time: document.getElementById('sClose').value,
    delivery_fee: parseFloat(document.getElementById('sFee').value),
    min_order: parseFloat(document.getElementById('sMin').value),
    avg_prep_time_min: parseInt(document.getElementById('sPrep').value),
    is_open: document.getElementById('sIsOpen').checked,
  };
  await api(`/restaurant-portal/${restId}/info`, { method: 'PUT', body: JSON.stringify(data) });
  document.getElementById('settingsSaved').textContent = '✓ Saved';
  setTimeout(() => { document.getElementById('settingsSaved').textContent = ''; }, 2000);
};

function statusBadge(s) {
  const m = { placed:'badge-yellow',confirmed:'badge-blue',preparing:'badge-yellow',ready:'badge-green',picked_up:'badge-blue',delivering:'badge-blue',delivered:'badge-green',cancelled:'badge-red' };
  return `<span class="badge ${m[s]||'badge-yellow'}">${s}</span>`;
}
function timeAgo(iso) {
  if (!iso) return '—';
  const d = new Date(iso), now = new Date(), diff = (now - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return d.toLocaleDateString();
}

initTheme();
if (token && restId) init();
</script>
