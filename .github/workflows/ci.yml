name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install requirements
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        run: cd backend && python -m pytest tests/ -v

  flutter-analyze:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Mobile — pub get & analyze
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Driver — pub get & analyze
        working-directory: driver
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Mobile — flutter test
        run: cd mobile && flutter test

      - name: Driver — flutter test
        run: cd driver && flutter test

  deploy:
    name: Deploy web to docs
    needs: [backend-tests, flutter-analyze]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable web
        run: flutter config --enable-web

      - name: Build rider web
        run: |
          cd mobile
          flutter pub get
          flutter build web --release \
            --dart-define=API_BASE=https://famba-api.onrender.com \
            --base-href=/famba/app/

      - name: Build driver web
        run: |
          cd driver
          flutter pub get
          flutter build web --release \
            --dart-define=API_BASE=https://famba-api.onrender.com \
            --base-href=/famba/driver/

      - name: Copy builds to docs
        run: |
          rsync -a --delete mobile/build/web/ docs/app/
          rsync -a --delete driver/build/web/ docs/driver/

      - name: Add service worker cache buster to index.html
        run: |
          python3 << 'PY'
          import pathlib

          block = """  <script>
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var r of registrations) { r.unregister(); }
              });
              caches.keys().then(function(names) {
                for (var name of names) { caches.delete(name); }
              });
            }
          </script>
          """
          for path in ("docs/app/index.html", "docs/driver/index.html"):
              p = pathlib.Path(path)
              t = p.read_text()
              if "getRegistrations" in t:
                  continue
              t = t.replace(
                  '<script src="flutter_bootstrap.js"',
                  block + '<script src="flutter_bootstrap.js"',
              )
              p.write_text(t)
          PY

      - name: Commit and push to main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app docs/driver
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(docs): deploy Flutter web builds [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
